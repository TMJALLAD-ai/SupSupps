[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Proxy /api/claude → Netlify Function (keeps the frontend unchanged)
[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude"
  status = 200

# SPA catch-all — required so refreshing any route returns the app shell
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
